# OTONOM trusted worker workflow -- version 2026.10.2
# Generated and owned by OTONOM (public generic worker market). Do not edit by
# hand: the control plane binds worker authentication to this workflow's
# repository, ref and commit.
name: OTONOM Worker
run-name: OTONOM worker ${{ inputs.assignment_id }}

on:
  workflow_dispatch:
    inputs:
      assignment_id:
        description: 'Opaque assignment id'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  run:
    name: worker
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout worker runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned OpenCode CLI
        run: |
          npm install --global @opencode/cli@2.0.16
          opencode --version

      - name: Bootstrap OTONOM worker session
        env:
          OTONOM_CONTROL_PLANE_URL: ${{ secrets.OTONOM_CONTROL_PLANE_URL }}
          OTONOM_ASSIGNMENT_ID: ${{ inputs.assignment_id }}
        run: |
          set -uo pipefail
          umask 077
          fail() { echo "OTONOM worker bootstrap failed: $1" >&2; exit 1; }
          [ -n "$OTONOM_CONTROL_PLANE_URL" ] || fail missing_control_plane_url
          HOST="${OTONOM_CONTROL_PLANE_URL#*://}"
          HOST="${HOST%%[/:?#]*}"
          echo "::add-mask::$HOST"
          AUDIENCE=$(printf '%s' "$OTONOM_CONTROL_PLANE_URL" | jq -sRr @uri) || fail audience_encode
          echo "::add-mask::$AUDIENCE"

          OIDC_BODY=$(mktemp) || fail oidc_tmp_creation
          trap 'rm -f "$OIDC_BODY" bootstrap-request.json bootstrap.json' EXIT
          OIDC_STATUS=$(curl --silent --location \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
            --output "$OIDC_BODY" \
            --write-out '%{http_code}' 2>/dev/null) || fail oidc_transport
          case "$OIDC_STATUS" in
            2??) ;;
            *) fail "oidc_http_$OIDC_STATUS" ;;
          esac
          OIDC_TOKEN=$(jq -er '.value' "$OIDC_BODY" 2>/dev/null) || fail oidc_response_invalid
          rm -f "$OIDC_BODY"
          echo "::add-mask::$OIDC_TOKEN"

          jq -n \
            --arg assignmentId "$OTONOM_ASSIGNMENT_ID" \
            --arg oidcToken "$OIDC_TOKEN" \
            '{assignmentId: $assignmentId, oidcToken: $oidcToken}' \
            > bootstrap-request.json || fail bootstrap_request_build
          BOOTSTRAP_ATTEMPT=1
          BOOTSTRAP_MAX_ATTEMPTS=3
          while :; do
            if BOOTSTRAP_STATUS=$(curl --silent --location \
              --connect-timeout 10 \
              --max-time 30 \
              -X POST "$OTONOM_CONTROL_PLANE_URL/api/v1/workers/bootstrap" \
              -H "Content-Type: application/json" \
              --data-binary @bootstrap-request.json \
              -o bootstrap.json \
              --write-out '%{http_code}' 2>/dev/null); then
              break
            fi
            if [ "$BOOTSTRAP_ATTEMPT" -ge "$BOOTSTRAP_MAX_ATTEMPTS" ]; then
              fail bootstrap_transport
            fi
            echo "OTONOM worker bootstrap transport retry ${BOOTSTRAP_ATTEMPT}/${BOOTSTRAP_MAX_ATTEMPTS}" >&2
            sleep "$BOOTSTRAP_ATTEMPT"
            BOOTSTRAP_ATTEMPT=$((BOOTSTRAP_ATTEMPT + 1))
          done
          rm -f bootstrap-request.json
          case "$BOOTSTRAP_STATUS" in
            2??) ;;
            *)
              ERROR_CODE=$(jq -r '.error // "UNKNOWN"' bootstrap.json 2>/dev/null | tr -cd 'A-Z0-9_-' | cut -c1-64)
              [ -n "$ERROR_CODE" ] || ERROR_CODE=UNKNOWN
              rm -f bootstrap.json
              fail "bootstrap_http_${BOOTSTRAP_STATUS}_${ERROR_CODE}"
              ;;
          esac
          chmod 600 bootstrap.json
          trap - EXIT

      - name: Execute OTONOM worker runner
        env:
          OTONOM_CONTROL_PLANE_URL: ${{ secrets.OTONOM_CONTROL_PLANE_URL }}
        run: |
          HOST="${OTONOM_CONTROL_PLANE_URL#*://}"
          HOST="${HOST%%[/:?#]*}"
          echo "::add-mask::$HOST"
          node .otonom/trusted-runner.mjs
